<title>Shadow Legion — Battle Doctrine</title>
<style>
  :root{
    --ground:#141014; --panel:#1e1418; --panel2:#271a1e; --ink:#ecdfcd; --dim:#a29181;
    --crimson:#c02a35; --brass:#b58e55; --line:#3f2c30; --good:#6d8a68;
  }
  html,body{height:100%;}
  body{ margin:0; background:var(--ground); color:var(--ink); overflow:hidden;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #deck{ position:fixed; inset:0; }
  .slide{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding:6vh 9vw 12vh; box-sizing:border-box; opacity:0; transform:translateX(40px);
    transition:opacity .45s ease, transform .45s ease; pointer-events:none; overflow-y:auto; }
  .slide.active{ opacity:1; transform:none; pointer-events:auto; }
  .slide.prev{ transform:translateX(-40px); }
  @media (prefers-reduced-motion: reduce){ .slide{ transition:none; transform:none; } }
  .eyebrow{ text-transform:uppercase; letter-spacing:.28em; font-size:12px; color:var(--brass); margin:0 0 14px; }
  h1{ font-family:Palatino,"Palatino Linotype",Georgia,serif; font-size:clamp(34px,5.2vw,64px);
    margin:0 0 18px; line-height:1.08; text-wrap:balance; }
  h1 .red{ color:var(--crimson); }
  h2{ font-family:Palatino,Georgia,serif; font-size:clamp(24px,3.4vw,40px); margin:0 0 16px; text-wrap:balance; }
  p.lead{ font-size:clamp(16px,1.6vw,20px); color:var(--dim); max-width:62ch; margin:0 0 10px; }
  .chapter{ align-items:flex-start; }
  .chapter .numeral{ font-family:Palatino,Georgia,serif; font-size:clamp(90px,16vw,200px);
    color:var(--crimson); line-height:.9; margin:0 0 8px; opacity:.9; }
  ul.pts{ margin:8px 0 0; padding:0 0 0 1.1em; max-width:70ch; }
  ul.pts li{ margin:0 0 12px; }
  ul.pts b{ color:var(--brass); }
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:start; }
  @media (max-width:820px){ .cols{ grid-template-columns:1fr; } }
  table{ border-collapse:collapse; font-size:13.5px; width:100%; }
  th{ text-align:left; text-transform:uppercase; letter-spacing:.1em; font-size:10px; color:var(--brass);
    padding:6px 10px; border-bottom:1px solid var(--line); }
  td{ padding:5px 10px; border-bottom:1px solid var(--line); }
  td.n{ font-family:ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .tbl{ border:1px solid var(--line); background:var(--panel); max-height:52vh; overflow:auto; }
  .tag{ display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:.1em;
    border-radius:2px; padding:1px 6px; font-weight:600; }
  .tag.own{ color:var(--good); border:1px solid var(--good); }
  .tag.buy{ color:#fff; background:var(--crimson); }
  .total{ font-family:ui-monospace,Menlo,monospace; color:var(--crimson); margin-top:10px; font-size:14px; }
  .kbd{ font-family:ui-monospace,Menlo,monospace; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:4px; padding:1px 7px; font-size:12px; background:var(--panel); }
  /* chrome */
  #hud{ position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; gap:18px;
    padding:14px 26px; box-sizing:border-box; background:linear-gradient(transparent, rgba(0,0,0,.35)); }
  #dots{ display:flex; gap:7px; flex:1; flex-wrap:wrap; }
  .dot{ width:9px; height:9px; border-radius:50%; border:1px solid var(--brass); background:transparent;
    cursor:pointer; padding:0; transition:background .2s; }
  .dot.on{ background:var(--crimson); border-color:var(--crimson); }
  .dot:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  #counter{ font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--dim); }
  .navbtn{ background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:4px;
    font-size:15px; padding:7px 16px; cursor:pointer; }
  .navbtn:hover{ border-color:var(--brass); }
  .navbtn:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  #bar{ position:fixed; top:0; left:0; height:3px; background:var(--crimson); transition:width .3s; }
  .sect{ position:fixed; top:16px; right:22px; text-transform:uppercase; letter-spacing:.2em;
    font-size:10.5px; color:var(--dim); }
</style>

<div id="bar"></div>
<div class="sect" id="sectlabel"></div>
<div id="deck"></div>

<div id="hud">
  <button class="navbtn" id="prev" aria-label="Previous slide">‹ Back</button>
  <div id="dots" role="tablist" aria-label="Slides"></div>
  <span id="counter"></span>
  <button class="navbtn" id="next" aria-label="Next slide">Next ›</button>
</div>

<script>
const S = [];
const slide = (section, html) => S.push({section, html});

/* ————— TITLE ————— */
slide('', `
  <p class="eyebrow">Shadow Legion · Word Bearers host · battle briefing</p>
  <h1>The <span class="red">Blood</span> and the <span class="red">Shadow</span></h1>
  <p class="lead">The battle plan for your army — and for the two tournament armies yours can grow into.
     Every rule here was checked against the current official points and rulebook (July 2026).</p>
  <p class="lead" style="margin-top:26px">Move through the slides with the <span class="kbd">→</span> and
     <span class="kbd">←</span> keys, the buttons below, or the dots. <span class="kbd">Home</span> returns here.</p>
`);

/* ————— I. STRATEGY ————— */
slide('I · Strategy', `
  <div class="chapter"><div class="numeral">I</div>
  <h1>Overall Army Strategy</h1>
  <p class="lead">One idea sits underneath everything: you are not trying to wipe out the enemy army.
     You are trying to control the board while the enemy exhausts itself killing things that refuse to stay dead.</p></div>
`);
slide('I · Strategy', `
  <h2>Three layers, one shadow</h2>
  <ul class="pts">
    <li><b>The sacrifices</b> — your Nurglings and Cultists. Cheap models whose whole job is to stand in the
        way: they block the paths enemies want to charge through and fill the empty spaces where enemy
        reinforcements would like to appear. When they die protecting something valuable, they did their job.</li>
    <li><b>The unmovables</b> — your Pink Horrors and monsters. They stand on the scoring markers and simply
        refuse to leave. Each Pink Horror that dies becomes two Blue Horrors, and each Blue becomes a living
        flame — the enemy has to kill the same unit three times to take the ground it stands on.</li>
    <li><b>The vanishing killers</b> — your army's signature trick. One upgrade, called <i>Fade to Darkness</i>,
        lets a unit that just killed something disappear off the table and return the next turn anywhere it likes.
        A second trick, <i>Binding Shadow</i>, pulls any endangered unit to safety the same way. The enemy can
        never plan around where your threats will be, because last turn's map is already wrong.</li>
  </ul>
  <p class="lead" style="margin-top:14px">Your army rule pays each of the four Chaos gods differently: Khorne's
     daemons may run <i>and still charge</i> · Tzeentch's daemons are harder to hit · Nurgle's daemons shrug off
     heavy weapons · Slaanesh's daemons cannot be shot as they charge in · and your mortal Word Bearers
     soldiers may appear from reserve anywhere on the board.</p>
`);

/* ————— II. WINNING ————— */
slide('II · Winning', `
  <div class="chapter"><div class="numeral">II</div>
  <h1>How to Win — for a New Player</h1>
  <p class="lead">The first truth of this game: you win on points scored, not enemies killed.
     A massacre where you forgot to stand on the scoring markers is a loss.</p></div>
`);
slide('II · Winning', `
  <h2>The scoring game</h2>
  <ul class="pts">
    <li><b>Stand on the markers.</b> The table has five or so scoring markers. At the start of each of your turns,
        you score points for every marker where your models outweigh theirs. Hold two markers and fight over a
        third — that simple habit wins most games. Each unit's card shows a number called
        <i>objective control</i> — its weight in that tug-of-war. A swarm of Nurglings has a weight of zero:
        wonderful at being in the way, useless at holding ground. Know which of your units actually count.</li>
    <li><b>Trade up.</b> Your armies also score for killing more than they lose each round (the rulebook calls
        this mission style <i>Purge the Foe</i>). The math is simple: if your 45-point screen dies so that your
        opponent's 200-point knight walks into your counterpunch, you got richer on the exchange.</li>
    <li><b>The rhythm of a game:</b> turn one, spread out and screen — patience. Turns two and three, commit
        your killers where they can both kill <i>and</i> claim a marker. Turns four and five, forget glory: a
        surviving monster standing on a marker is worth more than any kill.</li>
    <li><b>Your once-per-turn favor.</b> Each turn you earn one <i>command point</i> — currency for special
        one-time moves called <i>stratagems</i>. New this edition: a unit can only benefit from one such move
        per phase, so spend it on the moment that matters, not out of habit.</li>
  </ul>
`);

/* ————— III. MECHANICS ————— */
slide('III · Mechanics', `
  <div class="chapter"><div class="numeral">III</div>
  <h1>The Basic Mechanics</h1>
  <p class="lead">The seven-minute rulebook — and the three changes in this edition
     that quietly favor daemons.</p></div>
`);
slide('III · Mechanics', `
  <div class="cols">
  <div>
  <h2>How the dice work</h2>
  <ul class="pts">
    <li><b>To hit:</b> roll a six-sided die; your unit's card says what you need.</li>
    <li><b>To wound:</b> compare the attack's Strength to the target's Toughness. Twice as strong
        wounds on a 2 or better; stronger on 3+; equal on 4+; weaker on 5+.</li>
    <li><b>The save:</b> your opponent rolls to shrug the wound off with armor — which good weapons
        degrade — <i>or</i> with a special save that nothing degrades. Nearly your whole army carries
        that special save. Daemons don't wear armor; they simply refuse to be real.</li>
    <li><b>Damage</b> comes off the wounds printed on the card. Zero wounds, dead model.</li>
  </ul>
  </div>
  <div>
  <h2>This edition's gifts to you</h2>
  <ul class="pts">
    <li><b>Hiding behind things now makes you harder to hit</b> (instead of improving armor, which
        daemons barely use). For the first time, your whole army benefits from terrain. Hug it.</li>
    <li><b>Quiet infantry become invisible.</b> Foot units inside terrain that held their fire simply
        cannot be seen from more than fifteen inches away. Your Nurglings become ghosts.</li>
    <li><b>Reinforcements arrive nine inches from enemies</b> — and a nine-inch charge succeeds
        barely one time in four. So drop your reserves next to something already wounded, or next
        to a marker no one is guarding, not next to a fresh enemy line and a prayer.</li>
    <li><b>Leaders join only their own kind.</b> A Chaos Lord on foot may lead Legionaries; a lord in
        heavy Terminator plate may only lead Terminators. Check the pairing before you buy or build.</li>
  </ul>
  </div>
  </div>
`);

/* ————— IV. ARMIES ————— */
slide('IV · The Armies', `
  <div class="chapter"><div class="numeral">IV</div>
  <h1>The Three Armies</h1>
  <p class="lead">Your army as it stands this week — then the two armies that each won four of five
     games at real tournaments this month. Same rules, three personalities.</p></div>
`);
slide('IV · The Armies', `
  <h2>A · The Yo-Yo Court <span style="color:var(--dim);font-size:.55em">— your army, the learning build</span></h2>
  <div class="cols">
  <div class="tbl"><table>
    <tr><th>Unit</th><th style="text-align:right">Points</th><th></th></tr>
    <tr><td>Be'lakor — your general</td><td class="n">390</td><td><span class="tag own">own</span></td></tr>
    <tr><td>Lord of Change</td><td class="n">320</td><td><span class="tag own">own</span></td></tr>
    <tr><td>Chaos Lord (Mallex) with Fade to Darkness, leading 5 Legionaries</td><td class="n">210</td><td><span class="tag own">ordered</span></td></tr>
    <tr><td>5 more Legionaries</td><td class="n">90</td><td><span class="tag own">own</span></td></tr>
    <tr><td>Master of Possession leading 5 Possessed</td><td class="n">180</td><td><span class="tag own">own</span></td></tr>
    <tr><td>5 Havocs (the heavy guns)</td><td class="n">125</td><td><span class="tag own">own</span></td></tr>
    <tr><td>Fateskimmer with 3 Screamers</td><td class="n">175</td><td><span class="tag own">own</span></td></tr>
    <tr><td>Exalted Flamer with 10 Pink Horrors</td><td class="n">215</td><td><span class="tag own">own</span></td></tr>
    <tr><td>Nurglings, two swarms</td><td class="n">90</td><td><span class="tag own">own</span></td></tr>
    <tr><td>3 Flamers</td><td class="n">65</td><td><span class="tag own">own</span></td></tr>
    <tr><td>5 Flesh Hounds</td><td class="n">75</td><td><span class="tag own">ordered</span></td></tr>
    <tr><td>10 Cultists</td><td class="n">50</td><td><span class="tag own">own</span></td></tr>
  </table></div>
  <div>
  <ul class="pts">
    <li><b>The signature play:</b> Mallex and his Legionaries appear from reserve, charge whoever is
        babysitting a scoring marker, kill them, then <i>Fade</i> away at the end of the fight. On your
        opponent's own turn, Mallex's once-per-battle-round free favor brings the squad straight back.
        The only thing that can ever touch them is a lucky snap shot as they charge.</li>
    <li><b>Everyone else has one job:</b> Be'lakor stands at the center and is terrifying · the Lord of
        Change rains fire from behind the Horrors · the Havocs sit home and crack armor · the hounds
        and Screamers run errands at the board edges.</li>
  </ul>
  <p class="total">About 1,985 of 2,000 points · confirm in the official app before a tournament</p>
  </div></div>
`);
slide('IV · The Armies', `
  <h2>B · Marney's army <span style="color:var(--dim);font-size:.55em">— won 4 of 5 at a 231-player event in Edinburgh</span></h2>
  <div class="cols">
  <div class="tbl"><table>
    <tr><th>Unit</th><th style="text-align:right">Points</th></tr>
    <tr><td>Be'lakor — general</td><td class="n">390</td></tr>
    <tr><td>Bloodthirster with Fade to Darkness</td><td class="n">350</td></tr>
    <tr><td>Two Rendmasters on Blood Thrones</td><td class="n">300</td></tr>
    <tr><td>Skullmaster leading 6 Bloodcrushers, with Soul-shattering Charge</td><td class="n">275</td></tr>
    <tr><td>6 more Bloodcrushers, also with Soul-shattering Charge</td><td class="n">190</td></tr>
    <tr><td>Bloodmaster leading 10 Bloodletters</td><td class="n">175</td></tr>
    <tr><td>Two more squads of 10 Bloodletters</td><td class="n">220</td></tr>
    <tr><td>Nurglings</td><td class="n">45</td></tr>
    <tr><td>10 Cultists</td><td class="n">50</td></tr>
  </table></div>
  <div>
  <ul class="pts">
    <li><b>The idea:</b> thirty Bloodletters flood the middle of the board — Khorne units here may run and
        still charge, so they arrive a turn earlier than anyone expects. Behind them, two bricks of
        juggernaut cavalry and a Fading Bloodthirster take turns being the biggest problem on the table,
        while the Blood Thrones ride alongside making the cavalry hit even harder.</li>
    <li><b>Why it works for a newer player to study:</b> every unit points the same direction. There is no
        clever timing to fumble — screens forward, cavalry through, general holds the center.</li>
    <li><b>The record:</b> beat four different armies; its one loss was to Space Marines.</li>
  </ul>
  <p class="total">1,995 of 2,000 points</p>
  </div></div>
`);
slide('IV · The Armies', `
  <h2>C · "Red Bull Gives You Skulls" <span style="color:var(--dim);font-size:.55em">— Kersley's army, won 4 of 5</span></h2>
  <div class="cols">
  <div class="tbl"><table>
    <tr><th>Unit</th><th style="text-align:right">Points</th></tr>
    <tr><td>Bloodthirster with Fade to Darkness — the general (no Be'lakor!)</td><td class="n">350</td></tr>
    <tr><td>Skullmaster with Leaping Shadows, leading 6 Bloodcrushers</td><td class="n">290</td></tr>
    <tr><td>Skullmaster leading 6 Bloodcrushers, with Soul-shattering Charge</td><td class="n">275</td></tr>
    <tr><td>A third Skullmaster with 6 more Bloodcrushers, same upgrade</td><td class="n">285</td></tr>
    <tr><td>Great Unclean One with Mantle of Gloom</td><td class="n">285</td></tr>
    <tr><td>Rendmaster on Blood Throne</td><td class="n">150</td></tr>
    <tr><td>A Beast of Nurgle</td><td class="n">70</td></tr>
    <tr><td>5 Flesh Hounds</td><td class="n">75</td></tr>
    <tr><td>Two squads of 3 Plague Drones</td><td class="n">220</td></tr>
  </table></div>
  <div>
  <ul class="pts">
    <li><b>Eighteen juggernauts.</b> One cavalry brick starts the game nine inches further forward
        (that's what <i>Leaping Shadows</i> buys) and threatens a charge on turn one. The other two
        thunder in behind it, wave after wave.</li>
    <li><b>No Be'lakor</b> — proof your detachment doesn't require him. In his place, a mountain of
        rot squats on the center marker; its <i>Mantle of Gloom</i> weakens the grip of any enemy
        that comes close enough to wrestle for the ground.</li>
    <li><b>The quiet half wins the game:</b> the Beast, the drones, and the hounds do all the errand-running
        and marker-sitting while the cavalry deletes things. It won every game except against another daemon army.</li>
  </ul>
  <p class="total">2,000 of 2,000 points</p>
  </div></div>
`);
slide('IV · The Armies', `
  <h2>The road between them</h2>
  <ul class="pts">
    <li><b>This week:</b> play your Yo-Yo Court. It teaches the vanishing trick, screening, and how the
        Horrors die three deaths — with models you own, every one painted.</li>
    <li><b>The buying road, in order:</b> a Bloodthirster → a Skullmaster with six Bloodcrushers → a Blood
        Throne → more Bloodletters (your auction bid is already aimed there). Each purchase moves your
        army one step toward Marney's.</li>
    <li><b>The lesson from the winners' tables:</b> both tournament armies dropped the mortal Word Bearers
        soldiers almost entirely — a single squad of Cultists survives. Your Legionaries are training wheels,
        and good ones. Spend future money on juggernauts, not marines.</li>
    <li><b>Still to research:</b> both winning armies pair your detachment with a second one called
        <i>Cavalcade of Chaos</i> — the source of that Soul-shattering Charge upgrade. Its full rules
        are the next thing to pull.</li>
  </ul>
  <p class="lead" style="margin-top:16px">Evidence: the two tournament army lists are public on Listhammer;
     points and rules were verified against the official July 2026 update. Full citations live in the project's
     research file.</p>
`);

/* ————— engine ————— */
const deck = document.getElementById('deck');
S.forEach((s,i)=>{ const d=document.createElement('section'); d.className='slide'; d.setAttribute('aria-hidden','true'); d.innerHTML=s.html; deck.appendChild(d); });
const slides=[...deck.children];
const dots=document.getElementById('dots');
slides.forEach((_,i)=>{ const b=document.createElement('button'); b.className='dot'; b.setAttribute('aria-label','Slide '+(i+1)); b.onclick=()=>go(i); dots.appendChild(b); });
let cur=0;
function go(n){
  n=Math.max(0,Math.min(slides.length-1,n));
  slides[cur].classList.remove('active'); slides[cur].classList.add('prev'); slides[cur].setAttribute('aria-hidden','true');
  cur=n;
  slides[cur].classList.remove('prev'); slides[cur].classList.add('active'); slides[cur].setAttribute('aria-hidden','false');
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
  document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('sectlabel').textContent=S[cur].section;
  location.hash = cur ? String(cur+1) : '';
}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown') go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1);
  else if(e.key==='Home') go(0);
  else if(e.key==='End') go(slides.length-1);
});
const h=parseInt(location.hash.slice(1),10);
slides[0].classList.add('active');
go(!isNaN(h)&&h>=1?h-1:0);
</script>
