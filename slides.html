<title>Shadow Legion — Battle Doctrine</title>
<style>

  h1 .red{ color:var(--crimson); }
  h2{ font-family:Palatino,Georgia,serif; font-size:clamp(24px,3.4vw,40px); margin:0 0 16px; text-wrap:balance; }

  .chapter{ align-items:flex-start; }

  .tbl{ border:1px solid var(--line); background:var(--panel); max-height:52vh; overflow:auto; }

  /* chrome */
  #hud{ position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; gap:18px;

<div id="bar"></div>
<div class="sect" id="sectlabel"></div>
<div id="deck"></div>

<div id="hud">

  <div id="dots" role="tablist" aria-label="Slides"></div>
  <span id="counter"></span>

<script>
const S = [];
const slide = (section, html) => S.push({section, html});

/* ————— TITLE ————— */
slide('', `
  <p class="eyebrow">Shadow Legion · Word Bearers thrall-host · doctrine briefing</p>
  <h1>The <span class="red">Blood</span> and the <span class="red">Shadow</span></h1>

  <p class="lead" style="margin-top:26px">Navigate: <span class="kbd">→</span> <span class="kbd">←</span> keys,
     the buttons below, or click the dots. <span class="kbd">Home</span> returns here.</p>
`);

/* ————— I. STRATEGY ————— */
slide('I · Strategy', `
  <div class="chapter"><div class="numeral">I</div>
  <h1>Overall Army Strategy</h1>
  <p class="lead">One idea underneath everything: you are not trying to kill the enemy army.
     You are trying to own the board while it exhausts itself killing things that refuse to stay dead.</p></div>
`);
slide('I · Strategy', `
  <h2>Three layers, one shadow</h2>
  <ul class="pts">
    <li><b>Screens</b> — Nurglings and Cultists. Cheap bodies that stand in the way. They deny enemy
        deep strikes, block charge lanes, and die so nothing important has to. Losing them on schedule is winning.</li>
    <li><b>Anchors</b> — Pink Horrors (split three times before vanishing), Possessed, monsters. They sit on
        objectives and convert enemy effort into wasted turns.</li>
    <li><b>Hammers</b> — the reserves toolkit. Fade to Darkness returns a killer to Strategic Reserves after it
        kills; Binding Shadow (1CP) pulls anything uncommitted off the board; every Heretic Astartes unit
        Deep Strikes free. Your threats attack from angles that didn't exist last turn.</li>
  </ul>
  <p class="lead" style="margin-top:14px">The detachment rule pays each god differently: Khorne advances <i>and</i>
     charges · Tzeentch gets Stealth +−1 to be hit in melee · Nurgle gets −1 wounded vs high Strength ·
     Slaanesh ignores snap shooting · your marines get Dark Pacts + Deep Strike.</p>
`);

/* ————— II. WINNING ————— */
slide('II · Winning', `
  <div class="chapter"><div class="numeral">II</div>
  <h1>How to Win in 11th Edition</h1>
  <p class="lead">Beginner truth #1: games are won on victory points, not kills.
     A bloodbath you "won" 60–72 is a loss.</p></div>
`);
slide('II · Winning', `
  <h2>The scoring game</h2>
  <ul class="pts">
    <li><b>Primary: objectives.</b> Markers on the board, scored on your command phases for holding them.
        Hold two, contest a third — that wins most games. OC (Objective Control) decides holding:
        a 2 OC Legionary squad out-holds a 0 OC Nurgling swarm every time.</li>
    <li><b>Purge the Foe</b> (your lists' disposition): bonus points for killing more than you lose each round —
        it rewards <i>trading up</i>: spend a 45pt screen, take a 200pt reply.</li>
    <li><b>Turn rhythm:</b> T1 position and screen, don't overextend · T2–3 commit hammers where they
        kill AND cap · T4–5 pivot everything to scoring — a surviving hammer standing on a marker
        beats a dead enemy unit.</li>
    <li><b>Command Points:</b> 1 per turn. One stratagem per unit per phase (new in 11th) — pick the
        moment, not the habit.</li>
  </ul>
`);

/* ————— III. MECHANICS ————— */
slide('III · Mechanics', `
  <div class="chapter"><div class="numeral">III</div>
  <h1>Basic Mechanics</h1>
  <p class="lead">The seven-minute version of the rulebook — plus the 11th-edition changes

`);
slide('III · Mechanics', `
  <div class="cols">
  <div>
  <h2>The dice loop</h2>
  <ul class="pts">
    <li><b>Hit</b> — roll ≥ your WS/BS.</li>
    <li><b>Wound</b> — Strength vs Toughness: S≥2×T on 2s, S&gt;T on 3s, S=T on 4s, S&lt;T on 5s.</li>
    <li><b>Save</b> — they roll armor (your AP makes it worse) or invulnerable (ignores AP —
        nearly your whole army has one; it's why cover never helped you before).</li>
    <li><b>Damage</b> — wounds off the datasheet.</li>
  </ul>
  </div>
  <div>
  <h2>11th-ed changes that matter</h2>
  <ul class="pts">
    <li><b>Cover = −1 to be hit</b> (not a save bonus) → army-wide daemon buff. Hug terrain.</li>
    <li><b>Hidden / Gone to Ground</b> — infantry in terrain that held fire is undetectable beyond
        15" (12" obscured). Nurglings become ghosts.</li>
    <li><b>Deep strike</b> — arrive 9"+ from enemies; a 9" charge lands ~28%. Plan arrivals near
        weakened targets, not fresh ones.</li>
    <li><b>Leaders</b> — characters attach to specific units only (foot Lord → Legionaries;
        Skullmaster → Bloodcrushers). Check before you buy or build.</li>
    <li><b>Split</b> — each dead Pink Horror becomes 2 Blues; dead Blues become Brimstones.
        Your anchor unit dies three times.</li>
  </ul>
  </div>
  </div>
`);

/* ————— IV. LISTS ————— */
slide('IV · The Lists', `

`);

slide('IV · The Lists', `

    <tr><td>Bloodmaster → Bloodletters ×10</td><td class="n">175</td></tr>
    <tr><td>Bloodletters ×10 ×2</td><td class="n">220</td></tr>
    <tr><td>Nurglings ×3</td><td class="n">45</td></tr>
    <tr><td>Cultist Mob ×10</td><td class="n">50</td></tr>

  <div>
  <ul class="pts">
    <li><b>Detachments:</b> Shadow Legion + Cavalcade of Chaos (3 DP) — the second detachment

slide('IV · The Lists', `
  <h2>C · "Red Bull Gives You Skulls" <span style="color:var(--dim);font-size:.55em">— Kersley, 4-1, Burn &amp; Learn v17</span></h2>
  <div class="cols">

    <tr><td>Flesh Hounds ×5</td><td class="n">75</td></tr>

slide('IV · The Lists', `

/* ————— engine ————— */
const deck = document.getElementById('deck');
S.forEach((s,i)=>{ const d=document.createElement('section'); d.className='slide'; d.setAttribute('aria-hidden','true'); d.innerHTML=s.html; deck.appendChild(d); });
const slides=[...deck.children];
const dots=document.getElementById('dots');
slides.forEach((_,i)=>{ const b=document.createElement('button'); b.className='dot'; b.setAttribute('aria-label','Slide '+(i+1)); b.onclick=()=>go(i); dots.appendChild(b); });
let cur=0;
function go(n){
  n=Math.max(0,Math.min(slides.length-1,n));
  slides[cur].classList.remove('active'); slides[cur].classList.add('prev'); slides[cur].setAttribute('aria-hidden','true');
  cur=n;
  slides[cur].classList.remove('prev'); slides[cur].classList.add('active'); slides[cur].setAttribute('aria-hidden','false');
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
  document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('sectlabel').textContent=S[cur].section;
  location.hash = cur ? String(cur+1) : '';
}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown') go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1);
  else if(e.key==='Home') go(0);
  else if(e.key==='End') go(slides.length-1);
});
const h=parseInt(location.hash.slice(1),10);
slides[0].classList.add('active');
go(!isNaN(h)&&h>=1?h-1:0);
</script>
